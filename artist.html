<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030713">
  <title>LOUD — Artist Spotlight</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="navigation.css">
</head>
<body>
  <main class="mix-page spotlight">
    <img class="spotlight-aura" src="assets/artist-imgFxGradientLuminousAura.svg" alt="">
    <header class="intro">
      <div class="brand-rule" aria-hidden="true"><span></span></div>
      <p class="eyebrow">LOUD / DNA REPORT</p>
      <h1>Your #1 Artist</h1>
    </header>
    <figure class="spotlight-photo">
      <img class="spotlight-base" src="assets/artist-imgPhotoPostMalone.png" alt="">
      <img class="spotlight-portrait" src="assets/artist-imgImages11.png" alt="Post Malone">
      <div class="orbits" aria-hidden="true"><img src="assets/artist-imgArtFrequencyOrbit0.svg" alt=""><img src="assets/artist-imgArtFrequencyOrbit1.svg" alt=""><img src="assets/artist-imgArtFrequencyOrbit2.svg" alt=""><img src="assets/artist-imgArtFrequencyOrbit3.svg" alt=""></div>
      <figcaption><strong>Post Malone</strong><span>Your most played artist</span></figcaption>
    </figure>
    <section class="connection" aria-labelledby="connection-heading">
      <h2 id="connection-heading" class="eyebrow">Your connection</h2>
      <dl><div><dt>Top artist</dt><dd>#01</dd></div><div><dt>Minutes listened</dt><dd>420</dd></div></dl>
      <p>Photo + numbers to personalize</p>
    </section>
    <div class="screen-links"><a href="deep-cuts.html">Explore The Deep Cuts <span aria-hidden="true">↗</span></a></div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="playlist.html" aria-current="location">Playlist</a>
      <a class="nav-link" href="library/index.html">Library</a>
    </nav>
  </main>
</body>
</html>

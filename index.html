<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070d1f">
  <title>LOUD — Your Sound, Today</title>
  <link rel="stylesheet" href="home/style.css">
  <script src="home/script.js" defer></script>
  <link rel="stylesheet" href="navigation.css">
  <style>
    .home .home-menu {
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
      padding: 8px;
      margin-top: auto;
      border-radius: 22px;
    }

    .home .home-menu a.nav-link {
      grid-column: span 2;
      place-items: center;
      min-height: 38px;
      padding: 4px;
      border-radius: 12px;
      background: #ffffff0a;
      color: #bed2f5;
      font-size: 11px;
      line-height: 1.25;
      text-align: center;
      text-transform: none;
    }

    .home .home-menu a.nav-link:nth-child(n + 4) {
      grid-column: span 3;
    }

    .home .home-menu a.nav-link[aria-current] {
      background: #5b8fff35;
      color: #f3f7ff;
      box-shadow: inset 0 0 0 1px #5b8fff;
    }

    .home .home-menu a.nav-link[aria-current]::after {
      content: none;
    }

    .home .home-menu a.nav-link:hover {
      background: #5b8fff45;
      color: #f3f7ff;
    }

    .home .recommendations {
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <main class="home">
    <header class="intro">
      <div class="brand-rule" aria-hidden="true"></div>
      <p class="eyebrow">LOUD / HOME</p>
      <h1>Your sound, today.</h1>
      <p class="subtitle">Back to the music that feels like you.</p>
    </header>

    <section class="resume" aria-labelledby="track-title">
      <img class="portrait" src="home/assets/post-malone.png" alt="">
      <div class="halo" aria-hidden="true"></div>
      <div class="orbits" aria-hidden="true">
        <img src="home/assets/orbit-1.svg" width="114" height="114" alt="">
        <img src="home/assets/orbit-2.svg" width="156" height="156" alt="">
        <img src="home/assets/orbit-3.svg" width="198" height="198" alt="">
        <img src="home/assets/orbit-4.svg" width="240" height="240" alt="">
      </div>
      <div class="shade" aria-hidden="true"></div>
      <p class="eyebrow resume-label">Pick up where you left off</p>
      <div class="track-meta">
        <h2 id="track-title">Chemical</h2>
        <p>Post Malone</p>
      </div>
      <a class="play" href="https://open.spotify.com/search/Chemical%20Post%20Malone"
         target="_blank" rel="noopener" aria-label="Open Chemical by Post Malone in Spotify (new tab)">
        <img src="home/assets/play-disc.svg" width="49" height="49" alt="">
        <img src="home/assets/play.svg" width="24" height="24" alt="">
      </a>
      <p class="visually-hidden" id="play-status" role="status"></p>
    </section>

    <section class="recommendations" aria-labelledby="recommendations-title">
      <h2 class="eyebrow" id="recommendations-title">Made for you</h2>
      <div class="cards">
        <a class="card" href="playlist.html">
          <img class="card-cover" src="home/assets/november-mix.png" alt="">
          <span class="card-shade" aria-hidden="true"></span>
          <span class="card-meta">
            <span class="eyebrow">LOUD REPLAY</span>
            <strong>November Mix</strong>
          </span>
          <img class="card-arrow" src="home/assets/open.svg" width="15" height="15" alt="">
        </a>
        <a class="card" href="artist.html">
          <img class="card-cover" src="home/assets/artist-spotlight.png" alt="">
          <span class="card-shade" aria-hidden="true"></span>
          <span class="card-meta">
            <span class="eyebrow">LOUD DNA</span>
            <strong>Your #1 Artist</strong>
          </span>
          <img class="card-arrow" src="home/assets/open.svg" width="15" height="15" alt="">
        </a>
      </div>
    </section>

    <nav class="navigation home-menu" aria-label="Main navigation">
      <a class="nav-link" href="index.html" aria-current="page">Home</a>
      <a class="nav-link" href="playlist.html">Playlist</a>
      <a class="nav-link" href="library/index.html">Library</a>
      <a class="nav-link" href="artist.html">Your #1 Artist</a>
      <a class="nav-link" href="deep-cuts.html">The Deep Cuts</a>
      <a class="nav-link" href="queue/index.html">Queue</a>
      <a class="nav-link" href="audio-settings/index.html">Audio Settings</a>
    </nav>
  </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d1c" />
  <title>LOUD DNA — The Deep Cuts</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="mix-page deep-cuts" aria-label="LOUD DNA Extended Circle">

    <div class="content">
      <header class="page-header">
        <div class="brand-rule" aria-hidden="true"><span></span></div>
        <p class="eyebrow">LOUD / MORE OF YOUR DNA</p>
        <h1>THE DEEP CUTS.</h1>
        <p class="subtitle">Four more artists in your orbit.</p>
      </header>

      <section class="top-artists" aria-label="Artists five and six">
        <button class="artist-card" type="button" data-artist="Olivia Dean" data-rank="05">
          <div class="artist-photo">
            <img src="assets/deep-imgCaptureDecran202611131136291.png" alt="Olivia Dean" />
          </div>
          <div class="artist-footer">
            <span class="artist-number">05</span>
            <strong class="artist-name">OLIVIA DEAN</strong>
            <span class="artist-description">IN YOUR ROTATION</span>
          </div>
        </button>

        <button class="artist-card" type="button" data-artist="Ninho" data-rank="06">
          <div class="artist-photo">
            <img src="assets/deep-imgCaptureDecran202611131136551.png" alt="Ninho" />
          </div>
          <div class="artist-footer">
            <span class="artist-number">06</span>
            <strong class="artist-name">NINHO</strong>
            <span class="artist-description">IN YOUR ROTATION</span>
          </div>
        </button>
      </section>

      <section class="recap-section" aria-labelledby="recap-title">
        <h2 id="recap-title">NOVEMBER RECAP / 2026</h2>
        <p>A snapshot of your monthly listening.</p>

        <div class="recap-portraits">
          <button class="recap-photo" type="button" data-artist="Post Malone" data-rank="01" aria-label="View Post Malone">
            <img src="assets/deep-imgCaptureDecran202611131136292.png" alt="Post Malone"/>
          </button>
          <button class="recap-photo" type="button" data-artist="The Weeknd" data-rank="02" aria-label="View The Weeknd">
            <img src="assets/deep-imgCaptureDecran202611131136552.png" alt="The Weeknd"/>
          </button>
        </div>
      </section>
    </div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="nav-link" href="artist.html">Home</a>
      <a class="nav-link" href="index.html">Playlist</a>
      <a class="nav-link" href="deep-cuts.html" aria-current="page">Library</a>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

</html>

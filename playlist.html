<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030713">
  <title>LOUD — Monthly Mix</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="navigation.css">
</head>
<body>
  <main class="mix-page">
    <img class="mix-aura" src="assets/imgFxGradientLuminousAura1.svg" alt="">
    <header class="intro">
      <div class="brand-rule" aria-hidden="true"><span></span></div>
      <p class="eyebrow">LOUD / MONTHLY REPLAY</p>
      <h1>Your Mix.</h1>
      <p class="subtitle">The songs that shaped November.</p>
    </header>

    <section class="cover" aria-label="November monthly mix artwork">
      <img class="cover-aura" src="assets/imgFxGradientLuminousAura.svg" alt="">
      <div class="orbits" aria-hidden="true"><img src="assets/imgArtFrequencyOrbit0.svg" alt=""><img src="assets/imgArtFrequencyOrbit1.svg" alt=""><img src="assets/imgArtFrequencyOrbit2.svg" alt=""><img src="assets/imgArtFrequencyOrbit3.svg" alt=""></div>
      <span class="cover-logo">LOUD</span>
      <div class="cover-caption">
        <p class="cover-date">11 / 26</p>
        <p class="cover-subtitle">THE MONTHLY MIX</p>
      </div>
    </section>

    <section class="tracks" aria-labelledby="tracks-heading">
      <h2 id="tracks-heading">Your top tracks</h2>
      <ol class="track-list">
        <li class="track">
          <button class="track-button" type="button" aria-pressed="false" aria-label="Select Chemical by Post Malone">
            <span class="track-art" aria-hidden="true"><img src="assets/imgTrackCover1.png" alt=""></span>
            <span class="track-copy"><span class="track-title">Chemical</span><span class="track-artist">Post Malone</span></span>
            <span class="track-number">01</span>
          </button>
          <button class="more-button" type="button" aria-label="More options for Chemical">···</button>
        </li>
        <li class="track">
          <button class="track-button" type="button" aria-pressed="false" aria-label="Select Save Your Tears by The Weeknd">
            <span class="track-art" aria-hidden="true"><img src="assets/imgTrackCover2.png" alt=""></span>
            <span class="track-copy"><span class="track-title">Save Your Tears</span><span class="track-artist">The Weeknd</span></span>
            <span class="track-number">02</span>
          </button>
          <button class="more-button" type="button" aria-label="More options for Save Your Tears">···</button>
        </li>
        <li class="track">
          <button class="track-button" type="button" aria-pressed="false" aria-label="Select Cartier Santos by SDM">
            <span class="track-art" aria-hidden="true"><img src="assets/imgTrackCover3.png" alt=""></span>
            <span class="track-copy"><span class="track-title">Cartier Santos</span><span class="track-artist">SDM</span></span>
            <span class="track-number">03</span>
          </button>
          <button class="more-button" type="button" aria-label="More options for Cartier Santos">···</button>
        </li>
        <li class="track">
          <button class="track-button" type="button" aria-pressed="false" aria-label="Select Lover Girl by Megan Thee Stallion">
            <span class="track-art" aria-hidden="true"><img src="assets/imgTrackCover4.png" alt=""></span>
            <span class="track-copy"><span class="track-title">Lover Girl</span><span class="track-artist">Megan Thee Stallion</span></span>
            <span class="track-number">04</span>
          </button>
          <button class="more-button" type="button" aria-label="More options for Lover Girl">···</button>
        </li>
      </ol>
    </section>

    <div class="screen-links" aria-label="Playlist tools and monthly recap">
      <a href="queue/index.html">Queue</a>
      <a href="audio-settings/index.html">Audio Settings</a>
      <a href="artist.html">Your #1 Artist <span aria-hidden="true">↗</span></a>
      <a href="deep-cuts.html">The Deep Cuts <span aria-hidden="true">↗</span></a>
    </div>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="playlist.html" aria-current="page">Playlist</a>
      <a class="nav-link" href="library/index.html">Library</a>
    </nav>
    <p class="status-message" aria-live="polite"></p>
  </main>
</body>
</html>
